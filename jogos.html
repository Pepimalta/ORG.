<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos | Minha Oficina</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-tipo="jogos">
  <header class="cabecalho cabecalho-jogos">
    <div>
      <a class="voltar" href="index.html">← Voltar para a oficina</a>
      <p class="etiqueta">ARQUIVO DE JOGOS</p>
      <h1>Jogos</h1>
      <p class="subtitulo">Jogos, protótipos e experiências.</p>
    </div>

    <button class="botao-novo" id="abrir-formulario">
      + Novo jogo
    </button>
  </header>

  <main class="conteudo">
    <section>
      <div class="titulo-secao">
        <div>
          <p class="numero-arquivo">COLEÇÃO PARTICULAR</p>
          <h2>Meus jogos</h2>
        </div>

        <span class="contador" id="contador">0 jogos</span>
      </div>

      <div id="lista-itens" class="grade-itens"></div>

      <div id="lista-vazia" class="lista-vazia">
        <span>♟</span>
        <h3>Nenhum jogo arquivado</h3>
        <p>Adicione o primeiro jogo usando o botão acima.</p>
      </div>
    </section>
  </main>

  <dialog id="formulario-dialogo">
    <form id="formulario-item">
      <div class="topo-formulario">
        <div>
          <p class="numero-arquivo">NOVO REGISTRO</p>
          <h2>Novo jogo</h2>
        </div>

        <button
          type="button"
          id="fechar-formulario"
          class="botao-fechar"
          aria-label="Fechar"
        >
          ×
        </button>
      </div>

      <label>
        Nome do jogo
        <input id="nome-item" type="text" maxlength="80" required>
      </label>

      <label>
        Descrição
        <textarea id="descricao-item" rows="5" maxlength="500"></textarea>
      </label>

      <label>
        Status
        <select id="status-item">
          <option value="Ideia">Ideia</option>
          <option value="Protótipo">Protótipo</option>
          <option value="Em desenvolvimento">Em desenvolvimento</option>
          <option value="Pausado">Pausado</option>
          <option value="Finalizado">Finalizado</option>
        </select>
      </label>

      <div class="acoes-formulario">
        <button type="button" class="botao-secundario" id="cancelar-formulario">
          Cancelar
        </button>

        <button type="submit">
          Criar jogo
        </button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
