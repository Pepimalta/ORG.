<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos | Minha Oficina</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-tipo="projetos">
  <header class="cabecalho">
    <div>
      <a class="voltar" href="index.html">← Voltar para a oficina</a>
      <p class="etiqueta">ARQUIVO DE PROJETOS</p>
      <h1>Projetos</h1>
      <p class="subtitulo">Ideias, construções e experiências.</p>
    </div>

    <button class="botao-novo" id="abrir-formulario">
      + Novo projeto
    </button>
  </header>

  <main class="conteudo">
    <section>
      <div class="titulo-secao">
        <div>
          <p class="numero-arquivo">PASTA DE TRABALHO</p>
          <h2>Meus projetos</h2>
        </div>

        <span class="contador" id="contador">0 projetos</span>
      </div>

      <div id="lista-itens" class="grade-itens"></div>

      <div id="lista-vazia" class="lista-vazia">
        <span>⚙</span>
        <h3>Nenhum projeto arquivado</h3>
        <p>Crie o primeiro projeto usando o botão acima.</p>
      </div>
    </section>
  </main>

  <dialog id="formulario-dialogo">
    <form id="formulario-item">
      <div class="topo-formulario">
        <div>
          <p class="numero-arquivo">NOVA PASTA</p>
          <h2>Novo projeto</h2>
        </div>

        <button
          type="button"
          id="fechar-formulario"
          class="botao-fechar"
          aria-label="Fechar"
        >
          ×
        </button>
      </div>

      <label>
        Nome do projeto
        <input id="nome-item" type="text" maxlength="80" required>
      </label>

      <label>
        Descrição
        <textarea id="descricao-item" rows="5" maxlength="500"></textarea>
      </label>

      <label>
        Status
        <select id="status-item">
          <option value="Ideia">Ideia</option>
          <option value="Planejamento">Planejamento</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Pausado">Pausado</option>
          <option value="Concluído">Concluído</option>
        </select>
      </label>

      <div class="acoes-formulario">
        <button type="button" class="botao-secundario" id="cancelar-formulario">
          Cancelar
        </button>

        <button type="submit">
          Criar projeto
        </button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
