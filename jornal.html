<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jornal | Minha Oficina</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-tipo="jornal" class="pagina-jornal">
  <header class="cabecalho cabecalho-jornal">
    <div>
      <a class="voltar" href="index.html">← Voltar para a oficina</a>
      <p class="etiqueta">IMPRENSA PARTICULAR</p>
      <h1>Jornal</h1>
      <p class="subtitulo">Matérias, notícias e edições.</p>
    </div>

    <button class="botao-novo" id="abrir-formulario">
      + Nova matéria
    </button>
  </header>

  <main class="conteudo">
    <section>
      <div class="titulo-secao titulo-jornal">
        <div>
          <p class="numero-arquivo">ÚLTIMAS EDIÇÕES</p>
          <h2>Minhas matérias</h2>
        </div>

        <span class="contador" id="contador">0 matérias</span>
      </div>

      <div id="lista-itens" class="grade-itens grade-jornal"></div>

      <div id="lista-vazia" class="lista-vazia">
        <span>✎</span>
        <h3>Nenhuma matéria escrita</h3>
        <p>Comece uma matéria usando o botão acima.</p>
      </div>
    </section>
  </main>

  <dialog id="formulario-dialogo">
    <form id="formulario-item">
      <div class="topo-formulario">
        <div>
          <p class="numero-arquivo">NOVA PUBLICAÇÃO</p>
          <h2>Nova matéria</h2>
        </div>

        <button
          type="button"
          id="fechar-formulario"
          class="botao-fechar"
          aria-label="Fechar"
        >
          ×
        </button>
      </div>

      <label>
        Manchete
        <input id="nome-item" type="text" maxlength="120" required>
      </label>

      <label>
        Resumo
        <textarea id="descricao-item" rows="7" maxlength="1000"></textarea>
      </label>

      <label>
        Situação
        <select id="status-item">
          <option value="Rascunho">Rascunho</option>
          <option value="Revisão">Em revisão</option>
          <option value="Pronta">Pronta</option>
          <option value="Publicada">Publicada</option>
        </select>
      </label>

      <div class="acoes-formulario">
        <button type="button" class="botao-secundario" id="cancelar-formulario">
          Cancelar
        </button>

        <button type="submit">
          Criar matéria
        </button>
      </div>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
